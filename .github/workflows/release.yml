name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release version
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail

          current="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$current"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          previous_tag="$(git tag --list 'v*.*.*' --sort=-version:refname \
            | grep -Fxv "$GITHUB_REF_NAME" \
            | head -n 1 || true)"
          if [ -z "$previous_tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="${previous_tag#v}"
          IFS=. read -r previous_major previous_minor _ <<< "$previous"
          if [ "$major" != "$previous_major" ] || [ "$minor" != "$previous_minor" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping patch-only release: ${GITHUB_REF_NAME}"
          fi

      - name: Install Rust
        if: steps.release_gate.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        if: steps.release_gate.outputs.should_release == 'true'
        run: cargo test --all-targets

      - name: Build macOS app
        if: steps.release_gate.outputs.should_release == 'true'
        run: ./package.sh

      - name: Archive app bundle
        if: steps.release_gate.outputs.should_release == 'true'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/winflow.app \
            "dist/winflow-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub Release
        if: steps.release_gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/winflow-${{ github.ref_name }}.zip
